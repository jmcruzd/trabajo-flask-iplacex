<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Cálculo de Compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="form-card">
        <h1>Cálculo de compras</h1>
        <form method="POST">
            <div class="form-group">
                <label>Ingresa tu nombre</label>
                <input type="text" name="nombre" value="{{ nombre if nombre else '' }}" required>
            </div>
            <div class="form-group">
                <label>Ingresa tu edad</label>
                <input type="number" name="edad" value="{{ edad if edad else '' }}" required>
            </div>
            <div class="form-group">
                <label>Ingresa la cantidad de tarros de pintura a comprar</label>
                <input type="number" name="cantidad" value="{{ cantidad if cantidad else '' }}" required>
            </div>
            <button type="submit" class="btn-submit">Calcular</button>
        </form>

        {% if resultado %}
        <div class="resultados">
            <p>Nombre del cliente: {{ resultado.nombre }}</p>
            <p>Total sin descuento: ${{ resultado.total_normal }}</p>
            <p>El descuento es : ${{ resultado.descuento }}</p>
            <p>El total a pagar es de : ${{ resultado.total_descuento }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
